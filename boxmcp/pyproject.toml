[project]
name = "boxmcp"
version = "0.1.0"
description = "Local MCP bridge to a boxctl-managed SSH host"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
boxmcp = "boxmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxmcp"]

